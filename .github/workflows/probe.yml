name: Isolation probe

# Proves on a real hosted runner what kci-sandbox promises: code running as
# uid 2000 cannot read a secret root holds, cannot write the runner's file
# commands or step summary, cannot reach the runner's workflow command parser,
# and leaves no process behind, not even one a sandboxed PostgreSQL server
# started (COPY TO PROGRAM). The flutter job proves the same image property
# for the Flutter image: uid 2000 cannot plant a file in the SDK's bin or on
# root's PATH, root resolves its tools outside the SDK, and the Flutter tool
# still works as uid 2000. The public log shows only the secret's sha256 and
# one line per check; the probe's own output stays in a root-only file.
on:
  workflow_dispatch:
    inputs:
      expect_fail:
        description: Keep the probe's daemon alive, so the survivor check has to fail the job
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  # Puts ACTIONS_ID_TOKEN_REQUEST_URL and _TOKEN in the step environment, the
  # same as run.yml, so the probe can try to reach them from uid 2000.
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # The same image and container options run.yml pins, so the probe proves
      # the configuration that actually runs pull request code.
      image: ghcr.io/kodizm/kodizm-ci@sha256:750d4b92933bc9336901dc3488c7918c46d8c02a85f22f575584fa27609b002a
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - name: Probe the sandbox
        env:
          KCI_PROBE_EXPECT_FAIL: ${{ inputs.expect_fail }}
        run: |
          umask 077

          # 1. A secret only root may see: exported, so every root process this
          #    step starts (kci-sandbox among them) carries it in its environ,
          #    and in a 0600 file inside the runner's temp directory.
          KCI_PROBE_SECRET="kciprobe-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          export KCI_PROBE_SECRET
          printf 'secret-sha256=%s\n' "$(printf '%s' "$KCI_PROBE_SECRET" | sha256sum | cut -d' ' -f1)"

          secret_dir="$RUNNER_TEMP/kciprobe"
          mkdir -m 0700 "$secret_dir"
          printf '%s\n' "$KCI_PROBE_SECRET" >"$secret_dir/secret"

          install -d -m 0711 /kciprobe
          install -d -m 0700 /kciprobe/log
          install -d -m 0700 -o 2000 -g 2000 /kciprobe/out
          report=/kciprobe/out/report

          # 2. The probe as uid 2000. Its exit status is printed, not trusted:
          #    the verdict comes from the report and from root's own checks.
          keep=()
          if [ "$KCI_PROBE_EXPECT_FAIL" = true ]; then
            keep=(--keep)
          fi

          probe_status=0
          kci-sandbox "${keep[@]}" /kciprobe/log/probe.log /kciprobe/out \
            KCI_PROBE_FILE="$secret_dir/secret" \
            KCI_PROBE_TEMP="$RUNNER_TEMP" \
            KCI_PROBE_SUMMARY="$GITHUB_STEP_SUMMARY" \
            KCI_PROBE_ENV="$GITHUB_ENV" \
            KCI_PROBE_OUTPUT="$GITHUB_OUTPUT" \
            KCI_PROBE_PATH="$GITHUB_PATH" \
            -- kci-probe "$report" || probe_status=$?
          echo "probe: kci-sandbox exited $probe_status"

          failed=false
          if [ "$probe_status" -ne 0 ]; then
            failed=true
          fi

          # 3. Every check must be present and blocked; a missing line fails too.
          checks=(
            environ_secret
            environ_oidc
            environ_foreign
            cmdline_secret
            foreign_fd_write
            file_read
            temp_read
            summary_write
            file_commands_write
            open_fd
            tty_write
            privileges
          )
          for check in "${checks[@]}"; do
            if grep -qx "$check=blocked" "$report"; then
              echo "probe: $check blocked"
            else
              echo "probe: $check NOT blocked"
              failed=true
            fi
          done

          if grep -qx 'info_cmdline_readable=yes' "$report"; then
            echo 'probe: info: argv of other accounts is readable (no hidepid)'
          fi

          if ! grep -qx 'daemon=started' "$report"; then
            echo 'probe: daemon was not started, so the survivor check proves nothing'
            failed=true
          fi

          # 4. Root's own view: no marker in any file command file or the
          #    summary, nothing planted beside them.
          for command_file in "$GITHUB_STEP_SUMMARY" "$GITHUB_ENV" "$GITHUB_OUTPUT" "$GITHUB_PATH"; do
            if grep -qs KCIPROBE "$command_file"; then
              echo 'probe: a file command file holds a probe marker'
              failed=true
            fi
          done
          if [ -e "$(dirname "$GITHUB_ENV")/kciprobe-planted" ]; then
            echo 'probe: a file was planted beside the file command files'
            failed=true
          fi

          # 5. No live uid 2000 process may survive (zombies run no code and
          #    are not counted).
          live="$(ps -A -o uid=,stat= | awk '$1 == 2000 && $2 !~ /^Z/ { n++ } END { print n + 0 }')"
          echo "probe: live uid 2000 processes after the sandbox: $live"
          if [ "$live" -ne 0 ]; then
            failed=true
          fi

          if [ "$failed" = true ]; then
            echo 'probe: FAILED'
            exit 1
          fi
          echo 'probe: passed'

      # Skipped on an expect_fail run, whose first step fails by design: the
      # reap below would otherwise kill the daemon that run keeps on purpose.
      - name: Probe Postgres and the reap
        run: |
          failed=false
          report=/kciprobe/out/postgres-report

          # 1. The same --postgres wrapper run.yml's test jobs use: initdb,
          #    pg_ctl and a query as uid 2000. --keep leaves the server and the
          #    program COPY TO PROGRAM started, as a hostile test would.
          postgres_status=0
          kci-sandbox --keep --postgres /kciprobe/log/postgres.log /kciprobe/out \
            -- kci-probe --postgres "$report" || postgres_status=$?
          echo "probe: kci-sandbox --postgres exited $postgres_status"
          if [ "$postgres_status" -ne 0 ]; then
            failed=true
          fi

          for check in postgres_select copy_program; do
            if grep -qx "$check=ok" "$report"; then
              echo "probe: $check ok"
            else
              echo "probe: $check NOT ok"
              failed=true
            fi
          done

          # 2. The program has to be alive now, or the reap proves nothing.
          if pgrep -u 2000 -f kciprobe-copy-program >/dev/null; then
            echo 'probe: the COPY TO PROGRAM child outlived its session'
          else
            echo 'probe: the COPY TO PROGRAM child is not running'
            failed=true
          fi

          # 3. The reap every kci-job phase ends with must leave nothing alive.
          if ! kci-sandbox --reap; then
            failed=true
          fi
          live="$(ps -A -o uid=,stat= | awk '$1 == 2000 && $2 !~ /^Z/ { n++ } END { print n + 0 }')"
          echo "probe: live uid 2000 processes after the reap: $live"
          if [ "$live" -ne 0 ]; then
            failed=true
          fi

          if [ "$failed" = true ]; then
            echo 'probe: FAILED'
            exit 1
          fi
          echo 'probe: passed'

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # The flutter image run.yml pins, with the same container options.
      image: ghcr.io/kodizm/kodizm-ci-flutter@sha256:fbbd151da41f4fb863ee53692280e9e91941fbe46419e8eea279a5cf4788d79d
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - name: Probe the Flutter SDK and root's PATH
        run: |
          umask 077
          failed=false
          install -d -m 0711 /kciprobe
          install -d -m 0700 /kciprobe/log
          install -d -m 0700 -o 2000 -g 2000 /kciprobe/out
          report=/kciprobe/out/flutter-report

          # 1. uid 2000 tries to plant a file in the SDK and in every directory
          #    on root's PATH; root then looks for one itself.
          probe_status=0
          kci-sandbox /kciprobe/log/flutter-probe.log /kciprobe/out \
            -- kci-probe --flutter "$report" || probe_status=$?
          echo "probe: kci-sandbox --flutter exited $probe_status"
          if [ "$probe_status" -ne 0 ]; then
            failed=true
          fi

          if grep -qx 'flutter_sdk_write=blocked' "$report"; then
            echo 'probe: uid 2000 cannot write /opt/flutter/bin'
          else
            echo 'probe: uid 2000 CAN write /opt/flutter or /opt/flutter/bin'
            failed=true
          fi
          if grep -qx 'root_path_write=blocked' "$report"; then
            echo "probe: uid 2000 cannot write any directory on root's PATH"
          else
            echo "probe: uid 2000 CAN write a directory on root's PATH"
            failed=true
          fi
          for dir in /opt/flutter /opt/flutter/bin /opt/kci /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin; do
            if [ -e "$dir/kciprobe-planted" ]; then
              echo "probe: a file was planted in $dir"
              failed=true
            fi
          done

          # 2. Root's own PATH holds nothing of the SDK, and every tool the
          #    root side of kci-job and kci-sandbox runs resolves outside it.
          case ":$PATH:" in
            *:/opt/flutter*)
              echo "probe: root's PATH holds the Flutter SDK"
              failed=true
              ;;
          esac
          for tool in realpath setpriv pkill jq php curl; do
            if ! resolved="$(command -v "$tool")"; then
              echo "probe: root cannot resolve $tool"
              failed=true
            elif [[ "$resolved" == /opt/flutter/* ]]; then
              echo "probe: root resolves $tool inside /opt/flutter"
              failed=true
            else
              echo "probe: root resolves $tool to $resolved, outside /opt/flutter"
            fi
          done

          # 3. The tool still works as uid 2000 with only bin/cache its own:
          #    its version, then a minimal app through the commands the
          #    flutter roles run (pub get, analyze, a widget test). The app is
          #    written by hand: `flutter create` runs pub inside the SDK's own
          #    flutter_tools package, which no role does. The log is printed on
          #    a failure so the path the tool could not write is named.
          app=/kciprobe/out/app
          mkdir -p "$app/lib" "$app/test"
          printf '%s\n' \
            'name: kciprobe' \
            'environment:' \
            '  sdk: ^3.0.0' \
            'dependencies:' \
            '  flutter:' \
            '    sdk: flutter' \
            'dev_dependencies:' \
            '  flutter_test:' \
            '    sdk: flutter' \
            >"$app/pubspec.yaml"
          printf '%s\n' \
            "import 'package:flutter/widgets.dart';" \
            '' \
            "Widget probe() => const Directionality(textDirection: TextDirection.ltr, child: Text('kci'));" \
            >"$app/lib/main.dart"
          printf '%s\n' \
            "import 'package:flutter_test/flutter_test.dart';" \
            "import 'package:kciprobe/main.dart';" \
            '' \
            'void main() {' \
            "  testWidgets('renders', (tester) async {" \
            '    await tester.pumpWidget(probe());' \
            "    expect(find.text('kci'), findsOneWidget);" \
            '  });' \
            '}' \
            >"$app/test/probe_test.dart"
          chown -R 2000:2000 "$app"

          if kci-sandbox /kciprobe/log/flutter-version.log /kciprobe/out FLUTTER_SUPPRESS_ANALYTICS=true \
            -- flutter --version; then
            echo 'probe: flutter --version as uid 2000 ok'
          else
            echo 'probe: flutter --version as uid 2000 FAILED'
            tail -n 40 /kciprobe/log/flutter-version.log
            failed=true
          fi
          if kci-sandbox /kciprobe/log/flutter-app.log "$app" FLUTTER_SUPPRESS_ANALYTICS=true \
            PUB_CACHE=/kciprobe/out/pub-cache -- bash -c 'flutter pub get && flutter analyze && flutter test'; then
            echo 'probe: flutter pub get, analyze and test as uid 2000 ok'
          else
            echo 'probe: flutter pub get, analyze and test as uid 2000 FAILED'
            tail -n 40 /kciprobe/log/flutter-app.log
            failed=true
          fi

          if [ "$failed" = true ]; then
            echo 'probe: FAILED'
            exit 1
          fi
          echo 'probe: passed'
